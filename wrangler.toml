name = "shipfold"
compatibility_date = "2024-10-22"
pages_build_output_dir = ".vercel/output/static"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "jeevi"
database_id = "54f10dac-3872-4b21-9985-944c63bff784"

# Cloudflare R2 Bucket Binding
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "shipfold-apparel"

[vars]
NEXTAUTH_URL = "https://shipfold.pages.dev"
NEXT_PUBLIC_APP_URL = "https://shipfold.pages.dev"
