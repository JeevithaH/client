# GitLab CI/CD Pipeline for Shipfold -> Cloudflare Auto-Deploy

image: node:20

stages:
  - test
  - build
  - deploy

cache:
  paths:
    - node_modules/
    - .next/cache/

variables:
  NODE_ENV: "production"

install_and_test:
  stage: test
  script:
    - npm ci
    - npm run build
  only:
    - merge_requests
    - main

deploy_to_cloudflare:
  stage: deploy
  script:
    - npm ci
    - npm run build
    - npx wrangler pages deploy .next --project-name=shipfold --branch=main
  environment:
    name: production
    url: https://shipfold.pages.dev
  only:
    - main
